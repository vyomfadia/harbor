name: CI

# Backend-only CI: build, lint, static checks and Go unit tests against Postgres, Redis and OpenLDAP

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'src/portal/**'
  push:
    branches:
      - main
      - 'release-*'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'src/portal/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: build + lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Generate API server code
        run: make gen_apis
      - name: Build
        working-directory: src
        run: go build ./...
      - name: golangci-lint (includes govet)
        run: |
          # same pinned version as upstream CI
          version=$(grep -oE 'v2\.[0-9]+\.[0-9]+' tests/ci/ut_install.sh | head -n1)
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/main/install.sh | sh -s -- -b "$HOME/.local/bin" "$version"
          cd src && "$HOME/.local/bin/golangci-lint" run ./... --timeout=15m

  static-checks:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Generate API server code
        run: make gen_apis
      - name: Mocks up to date
        run: make mocks_check || { git diff; exit 1; }
      - name: misspell
        if: ${{ !cancelled() }}
        run: |
          go install "$(grep -oE 'github.com/client9/misspell/cmd/misspell@v[0-9.]+' tests/ci/ut_install.sh)"
          make misspell
      - name: Comment format
        if: ${{ !cancelled() }}
        run: make commentfmt
      - name: Swagger lint
        if: ${{ !cancelled() }}
        run: make lint_apis

  unit-test:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: root123
          POSTGRES_DB: registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRESQL_HOST: localhost
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USR: postgres
      POSTGRESQL_PWD: root123
      POSTGRESQL_DATABASE: registry
      HARBOR_ADMIN: admin
      HARBOR_ADMIN_PASSWD: Harbor12345
      CORE_SECRET: tempString
      REDIS_HOST: localhost
      UTTEST: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Generate API server code
        run: make gen_apis
      - name: Start OpenLDAP
        working-directory: tests
        run: ./ldapprepare.sh
      - name: Unit tests
        run: ./tests/ci/ut_lite.sh

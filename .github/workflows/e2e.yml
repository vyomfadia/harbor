name: E2E

# Installs Harbor with the docker-compose installer from the images built from this ref plus upstream's published images for
# the other components, then runs upstream's API suites and the OCI distribution conformance tests against it.

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  push:
    branches:
      - main
      - 'release-*'
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: harbor-core, component: core }
          - { image: harbor-jobservice, component: jobservice }
          - { image: harbor-portal, component: portal }
          - { image: harbor-registryctl, component: registryctl }
          - { image: registry-photon, component: registry }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-image
        with:
          image: ${{ matrix.image }}
          component: ${{ matrix.component }}
          tags: harbor-ci/${{ matrix.image }}:ci
          archive: ${{ runner.temp }}/${{ matrix.image }}.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.image }}
          path: ${{ runner.temp }}/${{ matrix.image }}.tar
          retention-days: 1

  test:
    name: ${{ matrix.suite }}
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite: [APITEST_DB, APITEST_DB_PROXY_CACHE, CONFORMANCE]
    env:
      HARBOR_ADMIN: admin
      HARBOR_ADMIN_PASSWD: Harbor12345
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Load images
        run: for f in "$RUNNER_TEMP"/images/*.tar; do docker load -i "$f"; done
      - name: Install Harbor
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ip=$(hostname -I | awk '{print $1}')
          echo "IP=$ip" >> "$GITHUB_ENV"
          ./tests/ci/compose_install.sh "$ip"

      - name: API tests
        if: matrix.suite != 'CONFORMANCE'
        env:
          SUITE: ${{ matrix.suite == 'APITEST_DB' && 'DB' || 'PROXY_CACHE' }}
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PWD: ${{ secrets.DOCKER_PWD }}
        run: ./tests/ci/api_run.sh "$SUITE" "$IP"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.suite == 'CONFORMANCE'
        with:
          go-version: stable
          cache: false
      - name: OCI distribution conformance
        if: matrix.suite == 'CONFORMANCE'
        env:
          # upstream's registry (distribution v2.8) accepts out-of-order and repeated chunks, also with goharbor/registry-photon
          OCI_CONFORMANCE_SKIP: should return 416|Get on stale blob upload
        run: |
          sudo cp tests/harbor_ca.crt /usr/local/share/ca-certificates/
          sudo update-ca-certificates
          ./tests/ci/conformance_test.sh "$IP"

      - name: Collect logs
        if: failure()
        run: |
          sudo docker compose -f make/docker-compose.yml ps -a > compose-ps.txt || true
          sudo tar -czf harbor-logs.tar.gz /var/log/harbor compose-ps.txt || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ${{ matrix.suite }}-logs
          path: |
            harbor-logs.tar.gz
            output.xml
            log.html
            report.html
            distribution-spec/conformance/report.html
            distribution-spec/conformance/junit.xml
          if-no-files-found: ignore
          retention-days: 7
